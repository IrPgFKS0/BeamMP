<md-content style="background:none">
	<div style="display:grid">
		<div layout="row">
			<div class="serverListSearch" style="margin:0">
				<input flex="" class="bng-input mp-search" type="text" id="directip" name="ip" placeholder="{{:: 'ui.multiplayer.direct_connect.server_ip' | translate}}" value="" tabindex="1"/>
			</div>
			<button class="bng-button-link" style="margin-top:0" ng-click="multiplayer.pasteClipboardToDirectIP()">{{:: 'ui.multiplayer.pasteFromClipboard' | translate}}</button>
		</div>
		<div layout="row">
			<div class="serverListSearch" style="margin:0">
				<input flex="" class="bng-input mp-search" type="text" id="directport" name="port" placeholder="{{:: 'ui.multiplayer.direct_connect.server_port' | translate}}" value="" tabindex="2"/>
			</div>
		</div>
		<!--<input type="text" id="nickname" name="nickname" placeholder="Nickname"/>-->
		<div layout="row">
			<button style="margin-left:0;" id="direct-connect-button" class="default-case bng-button-main" ng-click="multiplayer.directConnect()" tabindex="3">{{:: 'ui.multiplayer.connect' | translate}}</button>
			<button id="add-fav-button" class="default-case bng-button-link" ng-click="multiplayer.directConnectFavorite()" tabindex="4">{{:: 'ui.multiplayer.favorite' | translate}}</button>
		</div>
	</div>
	<div id="footer"></div>

</md-content>
